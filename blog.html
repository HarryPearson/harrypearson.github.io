<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Harry Pearson</title>
    <meta
      name="description"
      content="Blog posts from Harry Pearson on ServiceNow, engineering, fitness and finance."
    />
    <meta property="og:title" content="Blog - Harry Pearson" />
    <meta
      property="og:description"
      content="Blog posts from Harry Pearson on ServiceNow, engineering, fitness and finance."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harrypearson.co.uk/blog.html" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <style>
      .container {
        width: 95%;
        margin-right: auto;
        margin-left: auto;
        padding-right: 10px;
        padding-left: 10px;
      }

      @media (min-width: 1536px) {
        .container {
          max-width: 1024px !important;
        }
      }

      @media (min-width: 1024px) {
        .container {
          max-width: 1024px;
        }
      }

      @media (min-width: 768px) {
        .container {
          max-width: 768px;
        }
      }

      @media (min-width: 640px) {
        .container {
          max-width: 640px;
        }
      }
    </style>
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
  <div class="container mt-10">
    <div class="flex justify-end items-center mb-4 font-medium text-gray-600 dark:text-gray-400">
      <a href="index.html">Home</a
      ><span class="mx-2 font-bold">·</span
      ><a href="blog.html" class="font-bold">Blog</a>
      <button
        type="button"
        onclick="toggleTheme()"
        aria-label="Toggle dark mode"
        class="ml-4 inline-flex items-center justify-center rounded-md p-1 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
      >
        <svg class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
    <h1 class="text-4xl font-bold">Blog</h1>
    <div class="mb-5 font-medium text-gray-600 dark:text-gray-400">
      Thoughts on ServiceNow, engineering, fitness & finance.
    </div>

    <div id="posts-list" class="mt-8">
      <div class="text-sm text-gray-500 dark:text-gray-400">Loading posts...</div>
    </div>
    <noscript>
      <div class="mt-8 text-sm text-gray-700 dark:text-gray-300">
        This page needs JavaScript to load the post list. You can view the
        raw list at <a href="posts/posts.json">posts/posts.json</a>.
      </div>
    </noscript>

    <div class="flex justify-center mt-8 mb-5 font-medium text-gray-600 dark:text-gray-400">
      <a target="_blank" href="https://github.com/harrypearson">GitHub</a
      ><span class="mx-2 font-bold">·</span
      ><a target="_blank" href="https://www.linkedin.com/in/harryjpearson/"
        >LinkedIn</a
      ><span class="mx-2 font-bold">·</span
      ><a target="_blank" href="https://twitter.com/_harrypearson">Twitter</a>
      <span class="mx-2 font-bold">·</span
      ><a target="_blank" href="mailto:harrypearsonbusiness@gmail.com"
        >Email</a
      >
    </div>
  </div>

  <script>
    function toggleTheme() {
      var isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    async function loadPosts() {
      const list = document.getElementById("posts-list");
      try {
        const res = await fetch("posts/posts.json");
        const posts = await res.json();
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (posts.length === 0) {
          list.innerHTML =
            '<div class="text-sm text-gray-500 dark:text-gray-400">No posts yet.</div>';
          return;
        }

        list.innerHTML = posts
          .map(
            (post) => `
          <a
            href="post.html?post=${encodeURIComponent(post.slug)}"
            class="block mb-4 rounded-lg shadow bg-white dark:bg-gray-800 cursor-pointer overflow-hidden transition-all duration-200 hover:shadow-lg"
          >
            <div class="p-6">
              <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">${
                post.title
              }</h3>
              <div class="mt-1 text-sm text-gray-500 dark:text-gray-400">${post.date}</div>
              <div class="mt-3 text-sm text-gray-700 dark:text-gray-300">${post.excerpt}</div>
            </div>
          </a>
        `
          )
          .join("");
      } catch (err) {
        list.innerHTML =
          '<div class="text-sm text-red-600 dark:text-red-400">Could not load posts.</div>';
      }
    }

    loadPosts();
  </script>
  </body>
</html>
